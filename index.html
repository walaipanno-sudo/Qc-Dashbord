<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QC Check Sheet - GitHub Pages Edition</title>
    <!-- โหลด Tailwind CSS และ FontAwesome แบบปลอดภัยสำหรับการเชื่อมต่อข้ามค่าย -->
    <link rel="stylesheet" href="https://cloudflare.com" crossorigin="anonymous" referrerPolicy="no-referrer">
    <link rel="stylesheet" href="https://cloudflare.com" crossorigin="anonymous" referrerPolicy="no-referrer">
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white bg-opacity-10 p-2.5 rounded-xl">
                    <i class="fa-solid fa-clipboard-check text-2xl text-indigo-200"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">QC & Production Dashboard</h1>
                    <p class="text-xs text-indigo-200 flex items-center gap-1.5">
                        <span id="syncStatusIndicator" class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span>
                        <span id="syncStatusText">กำลังเชื่อมต่อฐานข้อมูล Google Sheets...</span>
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-2.5">
                <button onclick="forceSyncData()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-xl shadow transition text-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate" id="syncIcon"></i> ซิงค์ข้อมูล
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
        <!-- Notification Toast -->
        <div id="toast" class="hidden fixed bottom-5 right-5 z-50 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3">
            <i id="toast-icon" class="fa-solid fa-circle-info text-blue-400 text-lg"></i>
            <span id="toast-msg" class="text-sm font-medium">ระบบกำลังทำงาน...</span>
        </div>

        <!-- Table Data Section -->
        <div class="bg-white rounded-2xl shadow border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-gray-500 font-medium">
                            <th class="p-4">QC ID</th>
                            <th class="p-4">วันที่</th>
                            <th class="p-4">แผนก</th>
                            <th class="p-4">รายละเอียดสรุป</th>
                            <th class="p-4 text-center">สถานะ</th>
                            <th class="p-4">ผู้ตรวจสอบ</th>
                            <th class="p-4 text-center">STAMP</th>
                            <th class="p-4 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100">
                        <tr><td colspan="8" class="p-8 text-center text-gray-400">กำลังดาวน์โหลดข้อมูลตารางจาก Google Sheets...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // 🔒 ลิงก์เชื่อมโยง Web App จากหน้า Google Apps Script ของคุณ
        const BACKEND_API_URL = "https://google.com";

        let globalData = [];

        function forceSyncData() {
            const syncIcon = document.getElementById('syncIcon');
            if(syncIcon) syncIcon.classList.add('fa-spin');
            
            document.getElementById('syncStatusIndicator').className = "w-2 h-2 rounded-full bg-amber-400 inline-block";
            document.getElementById('syncStatusText').innerText = "กำลังดึงข้อมูลงานล่าสุด...";

            // สั่งเรียกข้อมูลโดยใช้การเปิดโหมดดักโครงสร้าง CORS และ No-Cache
            fetch(`${BACKEND_API_URL}?action=get`, {
                method: 'GET',
                cache: 'no-store'
            })
            .then(res => res.json())
            .then(data => {
                globalData = data;
                renderTable(data);
                document.getElementById('syncStatusIndicator').className = "w-2 h-2 rounded-full bg-green-500 inline-block";
                document.getElementById('syncStatusText').innerText = `เชื่อมต่อสำเร็จ (${data.length} รายการ)`;
                if(syncIcon) syncIcon.classList.remove('fa-spin');
            })
            .catch(err => {
                document.getElementById('syncStatusIndicator').className = "w-2 h-2 rounded-full bg-red-500 inline-block";
                document.getElementById('syncStatusText').innerText = "กรุณาตรวจสอบสิทธิ์การแชร์หลังบ้าน";
                if(syncIcon) syncIcon.classList.remove('fa-spin');
                showToast("ระบบความปลอดภัยเครือข่ายบล็อกการเชื่อมต่อฐานข้อมูล", "error");
                console.error(err);
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-gray-400">ไม่พบรายการข้อมูลในฐานข้อมูล</td></tr>`;
                return;
            }

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition duration-150";

                let statusClass = "bg-yellow-50 text-yellow-700 border border-yellow-200";
                if(row.status === 'PASS') statusClass = "bg-green-50 text-green-700 border border-green-200";
                if(row.status === 'FAIL') statusClass = "bg-red-50 text-red-700 border border-red-200";

                tr.innerHTML = `
                    <td class="p-4 font-semibold text-indigo-600">${row.id || '-'}</td>
                    <td class="p-4 text-gray-500">${row.date || '-'}</td>
                    <td class="p-4 font-medium">${row.department || '-'}</td>
                    <td class="p-4 text-gray-600">${row.details || '-'}</td>
                    <td class="p-4 text-center"><span class="px-2.5 py-1 rounded-full text-xs font-bold border ${statusClass}">${row.status}</span></td>
                    <td class="p-4 text-gray-500">${row.inspector || '-'}</td>
                    <td class="p-4 text-center font-medium">${row.stamp || '-'}</td>
                    <td class="p-4 text-center">
                        <button onclick="deleteItem('${row.id}')" class="text-red-500 hover:bg-red-50 p-2 rounded-xl transition duration-200" title="ลบข้อมูล">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteItem(id) {
            if (!id) return;
            if (!confirm(`คุณต้องการลบรายการ QC ID: ${id} ใช่หรือไม่?`)) return;

            showToast("กำลังส่งคำสั่งลบข้อมูลไปยัง Google Sheets...", "info");

            fetch(BACKEND_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'delete', id: id }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(response => {
                if (response.result === 'success') {
                    showToast("ลบข้อมูลรายการเรียบร้อยแล้ว", "success");
                    forceSyncData();
                } else {
                    showToast("ฐานข้อมูลแจ้งเตือน: " + response.message, "error");
                }
            })
            .catch(err => {
                showToast("เครื่องคุณถูกบล็อกสิทธิ์การส่งคำสั่งลบข้อมูล", "error");
                console.error(err);
            });
        }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const text = document.getElementById('toast-msg');

            text.innerText = msg;
            icon.className = "fa-solid text-lg " + 
                (type === 'success' ? 'fa-circle-check text-green-400' : 
                 type === 'error' ? 'fa-circle-xmark text-red-400' : 'fa-circle-info text-blue-400');

            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        window.addEventListener('DOMContentLoaded', forceSyncData);
    </script>
</body>
</html>
